<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>课表助手</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#0d0f13; --surface:#14171d; --surface-raised:#1a1e25; --field:#101318;
    --line:#252a33; --line-strong:#353c47; --fg:#e7eaf0; --muted:#98a0ad;
    --faint:#737c89; --accent:#8aa5e8; --on-accent:#101622;
    --accent-soft:rgba(138,165,232,.12); --today-bg:#151a23;
    --shadow:0 10px 32px rgba(0,0,0,.12); --radius:14px;
  }
  @media (prefers-color-scheme: light){
    :root{
      color-scheme:light;
      --bg:#f4f5f7; --surface:#fbfcfd; --surface-raised:#eff1f4; --field:#f4f6f8;
      --line:#e4e7eb; --line-strong:#d3d8df; --fg:#22262d; --muted:#727b88;
      --faint:#969eaa; --accent:#4f70ac; --on-accent:#ffffff;
      --accent-soft:rgba(79,112,172,.1); --today-bg:#f2f5fa;
      --shadow:0 10px 30px rgba(32,42,58,.045);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--fg);min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
                "Microsoft YaHei",system-ui,sans-serif;
    font-size:14px;line-height:1.6;font-variant-numeric:tabular-nums;
    padding:28px 24px calc(30px + env(safe-area-inset-bottom));
    max-width:960px;margin:0 auto;
  }
  button,input{font-family:inherit}
  button{transition:background .15s,border-color .15s,color .15s,transform .15s}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button:active{transform:scale(.97)}
  header{display:flex;align-items:flex-start;gap:16px;margin:0 2px 22px}
  .title{flex:1;min-width:0}
  .title h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.01em;line-height:1.4}
  .title p{margin:4px 0 0;font-size:12px;color:var(--muted);line-height:1.5;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ghost{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    min-height:36px;border:1px solid var(--line);background:var(--surface);color:var(--fg);
    border-radius:9px;padding:7px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;
  }
  .ghost svg{width:15px;height:15px;flex:none}
  .ghost:hover{background:var(--surface-raised);border-color:var(--line-strong)}
  .weekbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:0 2px 12px}
  .weeknav{grid-column:2;display:flex;align-items:center;gap:4px}
  .weekbar .label{min-width:196px;text-align:center;font-size:14px;font-weight:600;line-height:1.4}
  .weekbar .label span{color:var(--muted);font-weight:400;font-size:11.5px;margin-left:7px}
  #thisWeek{grid-column:3;justify-self:end;min-height:32px;padding:5px 10px;font-size:12px}
  .nav{
    width:32px;height:32px;border:1px solid transparent;border-radius:8px;
    background:transparent;color:var(--muted);font-size:21px;line-height:1;cursor:pointer;
    display:grid;place-items:center;user-select:none;padding:0 0 2px;
  }
  .nav:hover{background:var(--surface-raised);color:var(--fg)}
  .grid{
    display:grid;gap:1px;margin-bottom:20px;overflow:hidden;
    grid-template-columns:48px repeat(7,minmax(0,1fr));
    background:var(--line);border:1px solid var(--line);border-radius:12px;
  }
  .grid>*{min-width:0}
  .ghead{
    text-align:center;font-size:10.5px;color:var(--muted);background:var(--surface);
    padding:10px 2px 9px;line-height:1.45;
  }
  .ghead b{display:block;font-weight:550;font-size:12.5px;color:var(--fg)}
  .ghead span{display:block}
  .ghead.today{background:var(--today-bg)}
  .ghead.today b,.ghead.today span{color:var(--accent)}
  .ghead.today b{font-weight:600}
  .gt{
    font-size:10px;color:var(--faint);background:var(--surface);text-align:center;
    padding:9px 2px 0;line-height:1.25;
  }
  .gt b{display:block;font-weight:500;font-size:10.5px;color:var(--muted);letter-spacing:-.2px}
  .gt span{display:block;font-size:8.5px;color:var(--faint);letter-spacing:-.3px}
  .cell{background:var(--surface);min-height:70px}
  .cell.today{background:var(--today-bg)}
  .course{
    align-self:stretch;margin:4px 3px;padding:7px 6px 7px 7px;overflow:hidden;
    border:0;border-left:3px solid var(--ca);border-radius:5px;background:var(--cb);
    display:flex;flex-direction:column;gap:3px;cursor:default;
  }
  .course .n{
    font-size:12px;font-weight:500;line-height:1.35;word-break:break-word;color:var(--fg);
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;
  }
  .course .m{font-size:10.5px;color:var(--muted);line-height:1.35;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .course .m .short{display:none}
  .course .t{font-size:10px;color:var(--muted);line-height:1.3;opacity:.8}
  .panel{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow);
  }
  .panel h2{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--fg);letter-spacing:.02em}
  .askrow{display:flex;gap:8px}
  .askrow input{
    flex:1;min-width:0;height:42px;background:var(--field);border:1px solid var(--line);
    border-radius:10px;padding:9px 12px;color:var(--fg);font-size:13.5px;outline:none;
    transition:border-color .15s,box-shadow .15s;
  }
  .askrow input::placeholder{color:var(--faint)}
  .askrow input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .askrow button{
    min-width:62px;height:42px;border:0;border-radius:10px;padding:0 16px;font-size:13px;
    cursor:pointer;background:var(--accent);color:var(--on-accent);font-weight:600;
  }
  .askrow button:hover{filter:brightness(1.06)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .chip{
    border:1px solid transparent;background:var(--surface-raised);color:var(--muted);
    border-radius:999px;padding:5px 11px;font-size:11.5px;line-height:1.5;cursor:pointer;
  }
  .chip:hover{color:var(--fg);border-color:var(--line-strong)}
  .answer{
    margin-top:14px;padding:12px 13px;border-radius:10px;background:var(--field);
    border:1px solid var(--line);font-size:13px;line-height:1.75;white-space:pre-wrap;display:none;
  }
  .answer.show{display:block;animation:answer-in .18s ease-out}
  .answer .kw{color:var(--accent);font-weight:600}
  @keyframes answer-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
  footer{margin-top:18px;text-align:center;font-size:11px;color:var(--faint);line-height:1.8}
  .loading{opacity:.45}
  .course{position:relative}
  .course.moved{border-left-style:dashed}
  .course.moved::after{
    content:"调";position:absolute;top:2px;right:3px;font-size:8px;line-height:1;
    opacity:.55;letter-spacing:0;
  }
  .ovbar{
    display:none;align-items:center;gap:8px;margin:0 2px 12px;padding:7px 10px;
    border:1px solid var(--line);border-radius:9px;background:var(--surface);
    font-size:11.5px;color:var(--muted);
  }
  .ovbar.show{display:flex}
  .ovbar b{color:var(--fg);font-weight:500}
  .ovbar .sp{flex:1}
  .ovbar button{
    border:0;background:transparent;color:var(--accent);font-size:11.5px;
    cursor:pointer;padding:2px 4px;
  }
  .scrim{
    position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;
    transition:opacity .18s;z-index:40;
  }
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:41;transform:translateY(102%);
    transition:transform .22s ease-out;background:var(--surface);
    border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    max-width:640px;margin:0 auto;max-height:80vh;overflow:auto;
  }
  .sheet.show{transform:translateY(0)}
  .sheet h3{margin:0;font-size:14px;font-weight:600}
  .sheet .sub{font-size:11.5px;color:var(--muted);margin:3px 0 14px}
  .sheet .lbl{font-size:11px;color:var(--faint);margin:0 0 6px}
  .sheet .row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .opt{
    border:1px solid var(--line);background:var(--surface-raised);color:var(--fg);
    border-radius:8px;padding:7px 9px;font-size:11.5px;cursor:pointer;line-height:1.2;
  }
  .opt.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .sheet .acts{display:flex;gap:8px;margin-top:6px}
  .sheet .acts button{
    flex:1;height:42px;border-radius:10px;font-size:13px;cursor:pointer;
    border:1px solid var(--line);background:var(--surface);color:var(--fg);
  }
  .sheet .acts .primary{background:var(--accent);color:var(--on-accent);border:0;font-weight:600}
  .sheet .acts .danger{color:#d9534f}
  .loading{opacity:.45}
  @media (max-width:430px){
    body{padding:18px 10px calc(24px + env(safe-area-inset-bottom));font-size:13px}
    header{gap:8px;margin:0 2px 18px}
    .title h1{font-size:15px;line-height:1.35;text-wrap:balance}
    .title p{font-size:11px;margin-top:3px}
    .ghost{padding:6px 9px;font-size:11.5px;min-height:34px;gap:5px}
    .ghost svg{width:14px;height:14px}
    .weekbar{grid-template-columns:1fr auto;margin:0 2px 10px}
    .weeknav{grid-column:1;justify-self:start;gap:2px}
    .weekbar .label{min-width:160px;font-size:13px}
    .weekbar .label span{font-size:10px;margin-left:4px}
    #thisWeek{grid-column:2;padding:5px 8px;font-size:11px;min-height:30px}
    .nav{width:29px;height:30px;font-size:19px}
    .grid{grid-template-columns:31px repeat(7,minmax(0,1fr));gap:3px;border-radius:10px;margin-bottom:16px}
    .ghead{font-size:9.5px;padding:9px 1px 8px}
    .ghead b{font-size:11px}
    .gt{padding:7px 0 0}
    .gt b{font-size:8.5px;letter-spacing:-.3px}
    .gt span{font-size:7.5px;letter-spacing:0}
    .cell{min-height:62px}
    .course{margin:2px 1px;padding:4px 1px 4px 2px;gap:1px;border-left-width:2px;border-radius:4px}
    .course .n{font-size:9.5px;line-height:1.2;-webkit-line-clamp:3;letter-spacing:-.5px}
    .course .m{font-size:8.5px;line-height:1.25;letter-spacing:-.3px;opacity:.85}
    .course .m .full{display:none}
    .course .m .short{display:inline}
    .course .t{display:none}
    .panel{padding:14px;border-radius:12px}
    .panel h2{margin-bottom:10px}
    .askrow{gap:6px}
    .askrow input{height:40px;padding:8px 10px;font-size:13px}
    .askrow button{height:40px;min-width:52px;padding:0 12px;font-size:12px}
    .chips{gap:6px;margin-top:10px}
    .chip{padding:4px 9px;font-size:11px}
    .answer{font-size:12.5px;padding:11px 12px}
    footer{font-size:10px;margin-top:15px}
  }
  @media (prefers-reduced-motion:reduce){
    button{transition:none}
    .answer.show{animation:none}
  }
</style>
</head>
<body>

<header>
  <div class="title">
    <h1 id="cls">课表</h1>
    <p id="sub">加载中…</p>
  </div>
  <button class="ghost" id="ics">
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5.5 3v3M14.5 3v3M3.5 7.5h13M5 4.5h10A1.5 1.5 0 0 1 16.5 6v9a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 15V6A1.5 1.5 0 0 1 5 4.5Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    存进日历
  </button>
</header>

<div class="weekbar">
  <div class="weeknav">
    <button class="nav" id="prev" aria-label="上一周">‹</button>
    <div class="label" id="weekLabel">—<span></span></div>
    <button class="nav" id="next" aria-label="下一周">›</button>
  </div>
  <button class="ghost" id="thisWeek">本周</button>
</div>

<div class="ovbar" id="ovbar">
  <span id="ovtext"></span><span class="sp"></span>
  <button id="ovclear">全部撤销</button>
</div>

<div class="grid" id="grid"></div>

<div class="panel">
  <h2>课表问答</h2>
  <div class="askrow">
    <input id="q" aria-label="课表问题" placeholder="明天几节课 / 下一节是什么课">
    <button id="ask">发送</button>
  </div>
  <div class="chips">
    <button class="chip">今天有什么课</button>
    <button class="chip">明天几节课</button>
    <button class="chip">下一节</button>
    <button class="chip">哪天空</button>
    <button class="chip">本周课表</button>
    <button class="chip">今天几节课</button>
  </div>
  <div class="answer" id="answer"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>

<footer>
  数据来自教务系统导出的课表 · 本地运行，不上传任何内容<br>
  点「存进日历」可把整学期课程导入手机日历
</footer>

<script>
const $ = s => document.querySelector(s);
const PALETTE = [212, 350, 127, 264, 42, 180, 317, 95, 232, 10, 147, 285];

let meta = null;
let curWeek = null;

function colorOf(name){
  const idx = (meta && meta.palette && meta.palette[name]) || 0;
  const hue = PALETTE[idx % PALETTE.length];
  return {
    border: `hsl(${hue} 42% 55% / .95)`,
    bg:     `hsl(${hue} 42% 55% / .13)`
  };
}

function rowOf(period){ return Math.floor((period - 1) / 2) + 1; }

function renderGrid(days){
  const grid = $('#grid');
  grid.innerHTML = '';
  const maxPeriod = Math.max(8, ...days.flatMap(d => d.courses.map(c => c.endPeriod || 0)));
  const rows = Math.max(4, Math.ceil(maxPeriod / 2));

  // 表头
  const blank = document.createElement('div');
  blank.className = 'ghead';
  grid.appendChild(blank);
  const todayIso = new Date().toLocaleDateString('sv-SE');
  days.forEach(d => {
    const el = document.createElement('div');
    el.className = 'ghead' + (d.date === todayIso ? ' today' : '');
    el.innerHTML = `<b>${d.weekday}</b><span>${d.date.slice(5).replace('-','/')}</span>`;
    grid.appendChild(el);
  });

  // 节次列 + 空格子
  for (let r = 1; r <= rows; r++){
    const t = document.createElement('div');
    t.className = 'gt';
    const sp = (r - 1) * 2 + 1;
    t.innerHTML = `<b>${sp}-${sp + 1}</b><span>${(meta && meta.periodTimes && meta.periodTimes[sp]) || ''}</span>`;
    grid.appendChild(t);
    for (let c = 0; c < 7; c++){
      const cell = document.createElement('div');
      cell.className = 'cell' + (days[c].date === todayIso ? ' today' : '');
      cell.style.gridRow = String(r + 1);
      cell.style.gridColumn = String(c + 2);
      grid.appendChild(cell);
    }
  }

  // 课程块
  days.forEach((d, i) => {
    d.courses.forEach(c => {
      const startRow = rowOf(c.startPeriod);
      const endRow = rowOf(c.endPeriod) + 1;
      const span = Math.max(1, endRow - startRow);
      const el = document.createElement('div');
      const col = colorOf(c.name);
      el.className = 'course' + (c.moved ? ' moved' : '');
      el.style.gridRow = `${startRow + 1} / span ${span}`;
      el.style.gridColumn = String(i + 2);
      el.style.setProperty('--ca', col.border);
      el.style.setProperty('--cb', col.bg);
      el.title = `${c.name}\n${c.start}–${c.end}\n${c.location}\n${c.teacher}`;
      el.innerHTML = `<div class="n">${c.name}</div>
                      <div class="m"><span class="full">${c.location || ''}</span><span class="short">${c.room || c.location || ''}</span></div>
                      <div class="t">${c.start || ''}</div>`;
      el.onclick = () => openSheet(c, d);
      grid.appendChild(el);
    });
  });

  grid.style.gridTemplateRows = `auto repeat(${rows}, minmax(70px, auto))`;
}

async function loadWeek(week){
  const grid = $('#grid');
  grid.classList.add('loading');
  try{
    const url = week == null ? '/api/week' : `/api/week?week=${week}`;
    const data = await (await fetch(url)).json();
    curWeek = data.week;
    const label = $('#weekLabel');
    const first = data.days[0].date.slice(5).replace('-','/');
    const last = data.days[6].date.slice(5).replace('-','/');
    label.innerHTML = `第 ${data.week} 周<span>${first} – ${last}</span>`;
    renderGrid(data.days);
  }catch(e){
    grid.innerHTML = '<div style="grid-column:1/-1;color:var(--muted)">课表加载失败</div>';
  }finally{
    grid.classList.remove('loading');
  }
}

async function loadMeta(){
  meta = await (await fetch('/api/meta')).json();
  $('#cls').textContent = meta.className || '课表';
  $('#sub').textContent =
    `${meta.student || ''} · 今天${meta.weekday} · 第 ${meta.currentWeek} 周`;
}

async function ask(text){
  const q = (text ?? $('#q').value).trim();
  if (!q) return;
  const ans = $('#answer');
  ans.classList.add('show');
  ans.textContent = '…';
  try{
    const data = await (await fetch('/api/ask?q=' + encodeURIComponent(q))).json();
    ans.textContent = data.text || '';
    const d = data.data;
    if (data.intent === 'week' && d && d.days) {
      curWeek = d.week;
      $('#weekLabel').innerHTML =
        `第 ${d.week} 周<span>${d.days[0].date.slice(5).replace('-','/')} – ${d.days[6].date.slice(5).replace('-','/')}</span>`;
      renderGrid(d.days);
    } else if (d && d.courses && d.week != null) {
      await loadWeek(d.week);
    }
  }catch(e){
    ans.textContent = '请求失败，检查服务是否还在跑。';
  }
}

/* ---------- 调课 ----------
   这一版调课记录存在服务端 config/overrides.json，换设备也还在。
   请求完直接重拉当前周，服务端已经把例外算进去了，前端不重复实现一遍。 */
let ovs = [];
let edit = null;
const sheetEl = $('#sheet'), scrimEl = $('#scrim');

function dateOfWeekDay(w, day){
  const start = new Date(meta.semesterStart + 'T00:00:00');
  return new Date(start.getTime() + ((w - 1) * 7 + (day - 1)) * 86400000);
}
function isoOfDate(d){
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function dayOfIso(iso){ return new Date(iso + 'T00:00:00').getDay() || 7; }

function updateOvbar(){
  const bar = $('#ovbar');
  if (ovs.length){
    bar.classList.add('show');
    $('#ovtext').innerHTML = `已记录 <b>${ovs.length}</b> 处调课`;
  } else {
    bar.classList.remove('show');
  }
}

async function loadOverrides(){
  try{
    const r = await fetch('/api/overrides');
    ovs = (await r.json()).overrides || [];
  }catch(e){ ovs = []; }
  updateOvbar();
}

function closeSheet(){
  sheetEl.classList.remove('show');
  scrimEl.classList.remove('show');
}

function openSheet(c, day){
  const w = curWeek ?? meta.currentWeek;
  const exists = ovs.find(o => o.name === c.name && o.fromDate === day.date
                               && Number(o.fromPeriod) === Number(c.startPeriod))
              || ovs.find(o => o.type === 'move' && o.name === c.name
                               && o.toDate === day.date
                               && Number(o.toPeriod) === Number(c.startPeriod));
  edit = {
    name: c.name, date: day.date, week: w, period: c.startPeriod,
    span: Math.max(1, (c.endPeriod || c.startPeriod + 1) - c.startPeriod + 1),
    teacher: c.teacher || '', location: c.location || '', room: c.room || '',
    exists: exists || null, weekOffset: 0, toDay: day.day,
    toPeriod: Math.floor((c.startPeriod - 1) / 2) * 2 + 1
  };
  if (exists && exists.type === 'move'){
    const tw = Math.round(
      (new Date(exists.toDate + 'T00:00:00') - new Date(meta.semesterStart + 'T00:00:00')) / 86400000 / 7) + 1;
    edit.weekOffset = Math.max(0, Math.min(2, tw - w));
    edit.toDay = dayOfIso(exists.toDate);
    edit.toPeriod = Number(exists.toPeriod);
  }
  renderSheet();
  sheetEl.classList.add('show');
  scrimEl.classList.add('show');
}

function renderSheet(){
  const tw = edit.week + edit.weekOffset;
  const toDate = dateOfWeekDay(tw, edit.toDay);
  const endP = edit.toPeriod + edit.span - 1;
  const valid = tw >= 1 && tw <= 99;
  const noop = isoOfDate(toDate) === edit.date && edit.toPeriod === edit.period;
  const NAMES = ['', '周一', '周二', '周三', '周四', '周五', '周六', '周日'];

  let h = `<h3>${edit.name}</h3>`;
  h += `<div class="sub">第 ${edit.week} 周 ${NAMES[dayOfIso(edit.date)]} 第 ${edit.period}-${edit.period + edit.span - 1} 节 · ${edit.location || ''}</div>`;

  h += '<div class="lbl">移到</div><div class="row">';
  ['本周', '下周', '下下周'].forEach((t, i) => {
    h += `<button class="opt${edit.weekOffset === i ? ' on' : ''}" data-k="wo" data-v="${i}">${t}</button>`;
  });
  h += '</div>';

  h += '<div class="lbl">星期</div><div class="row">';
  for (let d = 1; d <= 7; d++){
    h += `<button class="opt${edit.toDay === d ? ' on' : ''}" data-k="day" data-v="${d}">${NAMES[d]}</button>`;
  }
  h += '</div>';

  h += '<div class="lbl">第几大节</div><div class="row">';
  for (let n = 1; n <= 6; n++){
    const sp = (n - 1) * 2 + 1;
    h += `<button class="opt${edit.toPeriod === sp ? ' on' : ''}" data-k="p" data-v="${sp}">${n}</button>`;
  }
  h += '</div>';

  const st = (meta.periodTimes && meta.periodTimes[edit.toPeriod]) || '';
  const et = (meta.periodEnd && meta.periodEnd[endP]) || '';
  h += `<div class="sub" style="margin:0 0 12px">→ 第 ${tw} 周 ${NAMES[edit.toDay]} ${st}–${et}（第 ${edit.toPeriod}-${endP} 节）${noop ? '　·　与原时间相同' : ''}</div>`;

  h += '<div class="acts">';
  h += '<button data-k="close">取消</button>';
  h += edit.exists
    ? '<button class="danger" data-k="undo">撤销调课</button>'
    : '<button class="danger" data-k="cancel">本次停课</button>';
  h += `<button class="primary" data-k="ok"${valid && !noop ? '' : ' disabled style="opacity:.5"'}>确认调课</button>`;
  h += '</div>';

  sheetEl.innerHTML = h;
}

async function postOverride(payload){
  const r = await fetch('/api/overrides', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  const data = await r.json();
  if (!r.ok){
    alert(data.error || '保存失败');
    return false;
  }
  ovs = data.overrides || [];
  updateOvbar();
  closeSheet();
  await loadWeek(curWeek ?? meta.currentWeek);
  return true;
}

sheetEl.onclick = async e => {
  const t = e.target.closest('[data-k]');
  if (!t) return;
  const k = t.dataset.k, v = t.dataset.v;
  if (k === 'wo'){ edit.weekOffset = +v; renderSheet(); }
  else if (k === 'day'){ edit.toDay = +v; renderSheet(); }
  else if (k === 'p'){ edit.toPeriod = +v; renderSheet(); }
  else if (k === 'close'){ closeSheet(); }
  else if (k === 'undo'){
    const o = edit.exists;
    if (!o) return closeSheet();
    await postOverride({ action: 'undo', name: o.name, fromDate: o.fromDate, fromPeriod: o.fromPeriod });
  }
  else if (k === 'cancel'){
    await postOverride({ action: 'cancel', name: edit.name, fromDate: edit.date,
                         fromPeriod: edit.period, span: edit.span,
                         teacher: edit.teacher, location: edit.location, room: edit.room });
  }
  else if (k === 'ok'){
    const tw = edit.week + edit.weekOffset;
    await postOverride({ action: 'move', name: edit.name, fromDate: edit.date,
                         fromPeriod: edit.period, span: edit.span,
                         toDate: isoOfDate(dateOfWeekDay(tw, edit.toDay)),
                         toPeriod: edit.toPeriod,
                         teacher: edit.teacher, location: edit.location, room: edit.room });
  }
};
scrimEl.onclick = closeSheet;
$('#ovclear').onclick = async () => {
  if (!ovs.length) return;
  if (!confirm(`撤销全部 ${ovs.length} 处调课？`)) return;
  await postOverride({ action: 'clear' });
};

$('#prev').onclick = () => loadWeek((curWeek ?? meta.currentWeek) - 1);
$('#next').onclick = () => loadWeek((curWeek ?? meta.currentWeek) + 1);
$('#thisWeek').onclick = () => loadWeek(meta.currentWeek);
$('#ics').onclick = () => { location.href = '/api/export.ics'; };
$('#ask').onclick = () => ask();
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
document.querySelectorAll('.chip').forEach(c =>
  c.onclick = () => { $('#q').value = c.textContent; ask(c.textContent); });

(async () => {
  await loadMeta();
  await loadOverrides();
  await loadWeek(meta.currentWeek);
  // 支持 ?q=明天几节课 深链，便于分享/演示
  const preset = new URLSearchParams(location.search).get('q');
  if (preset){ $('#q').value = preset; ask(preset); }
})();
</script>
