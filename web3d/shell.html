<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>课程档案架</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;overflow:hidden;
    background:#e8e5e1;color:#151713;
    font-family:-apple-system,"MiSans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  #stage{display:block;width:100%;height:100%}

  .ui{position:fixed;inset:0;pointer-events:none;z-index:2;transition:opacity 300ms linear}
  /* 面板展开时 HUD 退到背景：否则左下 09/17 和右下键位会贴着面板边缘，很乱 */
  body.sheet-open .ui{opacity:.16}
  .ui a,.ui button{pointer-events:auto}
  .tag{font-size:10px;letter-spacing:1.8px;color:#6f6c64}
  .num{font-variant-numeric:tabular-nums}

  /* 左上标题 */
  .brand{position:absolute;left:26px;top:22px}
  .brand h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.02em}
  .brand p{margin:5px 0 0;font-size:10px;letter-spacing:2.2px;color:#6f6c64;line-height:1.7}
  .brand p b{font-weight:600;color:#151713;letter-spacing:2.2px}

  /* 右上索引 */
  .idx{position:absolute;right:26px;top:24px;display:flex;gap:18px;align-items:center}
  .idx span{font-size:10px;letter-spacing:1.6px;color:#6f6c64}
  .idx i{font-style:normal;color:#151713}

  /* 左下计数 */
  .sel{position:absolute;left:26px;bottom:22px}
  .sel .tag{margin-bottom:4px}
  .sel .n{display:flex;align-items:baseline;gap:8px;line-height:1}
  .sel .n b{font-size:52px;font-weight:300;letter-spacing:-.02em}
  .sel .n s{text-decoration:none;font-size:13px;color:#8f8a80}

  /* 底部中间 */
  .foot{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);text-align:center}
  .foot .col{font-size:10px;letter-spacing:1.8px;color:#6f6c64;margin-bottom:5px}
  .foot .nm{font-size:12px;color:#151713;letter-spacing:.06em}

  /* 右下键位 */
  .keys{position:absolute;right:26px;bottom:24px;display:flex;gap:10px;align-items:center;
        font-size:10px;letter-spacing:1.4px;color:#8f8a80}
  .keys kbd{
    font:inherit;border:1px solid #bdb8ad;padding:2px 5px;color:#151713;background:transparent;
  }

  /* 引线标注：定位到选中脊顶，向右拉一条细线 */
  #callout{
    position:absolute;left:0;top:0;opacity:0;
    will-change:transform;pointer-events:none;
  }
  #callout .dot{position:absolute;left:-3px;top:-3px;width:6px;height:6px;background:#151713}
  #callout .line{
    position:absolute;left:calc(var(--lx, 0px));top:0;
    width:300px;height:1px;background:#151713;opacity:.55;
  }
  #callout .box{
    position:absolute;left:calc(22px + var(--ox, 0px));top:calc(-58px + var(--fy, 0px));
    width:290px;padding:8px 11px 9px;
    background:rgba(232,229,225,.94);
    border-left:1.5px solid #151713;
  }
  #callout .box .k{font-size:10px;letter-spacing:1.8px;color:#6f6c64}
  #callout .box .w{
    font-size:26px;font-weight:600;letter-spacing:.01em;margin:3px 0 2px;
    font-variant-numeric:tabular-nums;
  }
  #callout .box .meta{font-size:11px;color:#6f6c64;letter-spacing:1px}
  #callout .act{
    position:absolute;left:calc(22px + var(--ox, 0px));top:calc(34px + var(--fy, 0px));
    display:flex;align-items:center;gap:10px;
  }
  #callout .act .line2{width:196px;height:1px;background:#151713;opacity:.35}
  #callout .act button{
    font:inherit;background:none;border:0;cursor:pointer;color:#151713;
    font-size:10px;letter-spacing:1.8px;white-space:nowrap;
    pointer-events:auto;border-bottom:1px solid #151713;padding:0 0 1px;
  }
  #callout .act button:hover{color:#a67d48;border-color:#a67d48}


  /* ---------- 周档案面板 ----------
     点「打开课表」原地弹出，不再整页跳转到 index.html 重载。
     transform+opacity 走 GPU，行内容按 --i 逐条错开淡入。 */
  .scrim{
    position:fixed;inset:0;z-index:20;background:rgba(21,23,19,.26);
    opacity:0;pointer-events:none;transition:opacity 220ms linear;
  }
  .scrim.show{opacity:1;pointer-events:auto}

  .wsheet{
    position:fixed;left:0;right:0;bottom:0;z-index:21;
    max-width:740px;margin:0 auto;max-height:min(84vh,660px);
    display:flex;flex-direction:column;
    background:#f4f1ea;color:#151713;
    border-top:1px solid #151713;
    transform:translateY(102%);
    transition:transform 340ms cubic-bezier(.22,1,.36,1);
    will-change:transform;
  }
  .wsheet.show{transform:translateY(0)}

  .wtop{
    display:flex;align-items:baseline;gap:12px;
    padding:15px 18px 12px;border-bottom:1px solid #bdb8ad;position:relative;
  }
  .wtop .tag{font-size:10px;letter-spacing:1.8px;color:#6f6c64}
  .wtop .num{
    font-size:26px;font-weight:300;line-height:1;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;
  }
  .wtop .num s{text-decoration:none;font-size:13px;color:#8f8a80;margin-left:6px}
  .wtop .rng{margin-left:auto;font-size:11px;letter-spacing:1.1px;color:#6f6c64;
    font-variant-numeric:tabular-nums;padding-right:44px}
  .wx{
    position:absolute;top:12px;right:12px;width:36px;height:36px;
    display:grid;place-items:center;border:1px solid #bdb8ad;background:none;
    color:#151713;cursor:pointer;
  }
  .wx:hover{background:#151713;color:#f4f1ea;border-color:#151713}
  .wx svg{width:12px;height:12px}

  .wbody{overflow:auto;padding:2px 18px 20px;overscroll-behavior:contain}

  .wday{margin-top:15px}
  .wday:first-child{margin-top:6px}
  .wday h4{
    margin:0 0 4px;display:flex;align-items:baseline;gap:9px;
    font-size:10px;letter-spacing:1.8px;color:#6f6c64;font-weight:400;
  }
  .wday h4 b{font-size:11.5px;letter-spacing:1.2px;color:#151713;font-weight:500}
  .wday h4 i{font-style:normal;color:#a6a49c;font-size:10px}

  .wrow{
    display:grid;grid-template-columns:52px 1fr auto;gap:12px;
    padding:8px 0;border-bottom:1px solid #e2ded7;
    align-items:baseline;font-size:12.5px;
  }
  .wrow:last-child{border-bottom:0}
  .wrow .tm{font-size:10.5px;color:#6f6c64;font-variant-numeric:tabular-nums;letter-spacing:.2px}
  .wrow .nm{color:#151713;line-height:1.35}
  .wrow .nm em{
    font-style:normal;display:block;font-size:10px;color:#8f8a80;
    letter-spacing:.4px;margin-top:1px;
  }
  .wrow .mt{font-size:10.5px;color:#6f6c64;text-align:right;white-space:nowrap}

  /* 逐条淡入：只在展开时播放一次，靠 --i 错开 */
  .wsheet.show .wrow{
    animation:rowIn 320ms cubic-bezier(.22,1,.36,1) both;
    animation-delay:calc(var(--i,0) * 16ms);
  }
  @keyframes rowIn{
    from{opacity:0;transform:translateY(6px)}
    to{opacity:1;transform:none}
  }
  .wempty{padding:26px 0 30px;text-align:center;font-size:11.5px;color:#8f8a80;letter-spacing:1.2px}

  .wfoot{
    padding:10px 18px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid #e2ded7;
  }
  .wfoot a{
    font-size:10px;letter-spacing:1.6px;color:#6f6c64;text-decoration:none;
    border-bottom:1px solid #bdb8ad;padding-bottom:1px;
  }
  .wfoot a:hover{color:#a67d48;border-color:#a67d48}

  @media (prefers-reduced-motion:reduce){
    .wsheet{transition:none}
    .scrim{transition:none}
    .wsheet.show .wrow{animation:none}
  }

  @media (max-width:560px){
    .brand h1{font-size:17px}
    .brand p{display:none}
    .sel .n b{font-size:38px}
    #callout .box{width:190px}
    #callout .line{width:180px}
    #callout .act .line2{width:96px}
    .keys{display:none}
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="可交互的三维课程档案架"></canvas>

<div class="ui">
  <div class="brand">
    <h1>课程档案库</h1>
    <p>COURSE ARCHIVE<br>TIMETABLE / WEEKLY INDEX<br><b>ANALYSIS OS</b></p>
  </div>

  <div class="idx">
    <span>ARCHIVE INDEX <i id="idx">(17)</i></span>
    <span>SAVED <i>00</i></span>
  </div>

  <div class="sel">
    <div class="tag">ARCHIVE / SELECT</div>
    <div class="n"><b id="bigNum">09</b><s id="totalNum">/ 17</s></div>
  </div>

  <div class="foot">
    <div class="col">WEEK <b id="colNum">09</b> <span id="colTotal">/ 17</span></div>
    <div class="nm" id="slotName">第 9 周</div>
  </div>

  <div class="keys">
    <kbd>←</kbd><kbd>→</kbd><span>选档案</span><kbd>↑</kbd><kbd>↓</kbd><span>换列</span>
  </div>

  <div id="callout">
    <span class="dot"></span>
    <span class="line"></span>
    <div class="box">
      <div class="k">INTERNAL DATABASE</div>
      <div class="w" id="callWeek">WEEK 09</div>
      <div class="meta" id="callRange">10/26 – 11/01</div>
    </div>
    <div class="act">
      <span class="line2"></span>
      <button id="callLink" type="button">打开课表 →</button>
    </div>
  </div>
</div>

<div class="scrim" id="wsScrim"></div>

<section class="wsheet" id="wsheet" role="dialog" aria-modal="true" aria-label="本周课表">
  <div class="wtop">
    <span class="tag">WEEK</span>
    <span class="num" id="wsNum">09<s id="wsAll">/ 17</s></span>
    <span class="rng" id="wsRange">10/26 – 11/01</span>
    <button class="wx" id="wsClose" type="button" aria-label="关闭">
      <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
  </div>
  <div class="wbody" id="wsBody"></div>
  <div class="wfoot"><a href="index.html" id="wsFull">在表格里看完整学期 →</a></div>
</section>

<script>window.DATA = /*__DATA__*/null;</script>
<script>/*__BUNDLE__*/</script>
</body>
</html>
